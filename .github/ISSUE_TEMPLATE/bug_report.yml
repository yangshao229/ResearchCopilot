name: Bug 报告
description: 自测版的可复现错误（请勿提交密钥或私人论文）
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: "请先移除 API Key、.env、私人 PDF 内容、Vault 笔记和真实本机路径。"
  - type: input
    id: environment
    attributes:
      label: 环境
      description: 操作系统、浏览器、Python/uv/Node 版本（已知的部分即可）
      placeholder: "macOS 15 / Safari 18 / Python 3.12"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 从打开程序开始，尽量使用公开论文或不含原文的例子
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果与脱敏错误
      description: 截图前遮住论文、密钥、路径和个人信息
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: 隐私检查
      options:
        - label: 我已检查内容中没有 API Key、.env、私人论文或 Vault 笔记
          required: true
