[project]
name = "research-copilot"
version = "0.1.0"
description = "A local-first AI workspace for reading and understanding research papers."
authors = [
    { name = "yangshao229", email = "238594025+yangshao229@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "pypdf>=6.19.0",
    "sentence-transformers>=6.1.0",
    "uvicorn[standard]>=0.53.0",
]

[project.scripts]
research-copilot = "research_copilot:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]
